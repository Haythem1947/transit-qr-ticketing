services:
  mysql:
    image: mysql:8.0
    container_name: transit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ticket-service:
    build: ./services/ticket-service
    container_name: transit-ticket-service
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      APP_VERSION: "0.0.1"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  
  validation-service:
    build: ./services/validation-service
    container_name: transit-validation-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - TICKET_SERVICE_URL=http://ticket-service:8000
    depends_on:
      - ticket-service

volumes:
  mysqldata:
