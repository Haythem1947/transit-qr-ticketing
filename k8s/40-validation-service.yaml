apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation-service
  namespace: transit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validation-service
  template:
    metadata:
      labels:
        app: validation-service
    spec:
      containers:
        - name: validation-service
          image: DOCKERHUB_USER/transit-validation-service:IMAGE_TAG
          ports:
            - containerPort: 8000
          env:
            - name: TICKET_SERVICE_URL
              valueFrom:
                configMapKeyRef: {name: transit-config, key: TICKET_SERVICE_URL}
            - name: APP_VERSION
              value: "IMAGE_TAG"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: validation-service
  namespace: transit
spec:
  type: NodePort
  selector:
    app: validation-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081