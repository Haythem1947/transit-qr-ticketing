apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: transit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      enableServiceLinks: false
      containers:
        - name: ticket-service
          image: DOCKERHUB_USER/transit-ticket-service:IMAGE_TAG
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: transit-config
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: {name: transit-secret, key: MYSQL_USER}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: transit-secret, key: MYSQL_PASSWORD}
            - name: APP_VERSION
              value: "IMAGE_TAG"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: transit
spec:
  type: NodePort
  selector:
    app: ticket-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080